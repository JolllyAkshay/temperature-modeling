[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temperature-modeling"
version = "0.1.0"
description = "US electricity market load forecasting and day-ahead price curve tool covering NYISO, CAISO, MISO, ERCOT, SPP, PJM, and ISO-NE"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "plotly>=5.18",
    "dash>=2.14",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3.11",
    "responses>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
