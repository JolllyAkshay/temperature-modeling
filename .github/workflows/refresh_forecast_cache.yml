name: Refresh Forecast Cache

on:
  schedule:
    # Every 6 hours — GFS updates 4x/day so this keeps forecasts fresh
    - cron: "0 */6 * * *"
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    # SPP's price history is per-day file downloads and alone measured ~5min
    # cold; with 7 ISOs' worth of forecast + forward-curve building in one
    # run, 15min was too tight a margin.
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download model PKL files from HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p api_cache
          python - <<'EOF'
          import os
          from huggingface_hub import hf_hub_download

          repo = "JollyAkshay/grid-dashboard"
          token = os.environ["HF_TOKEN"]
          models = [
              "api_cache/pjm_load_model.pkl",
              "api_cache/caiso_load_model.pkl",
              "api_cache/ercot_load_model.pkl",
              "api_cache/miso_load_model.pkl",
              "api_cache/nyiso_load_model.pkl",
              "api_cache/isone_load_model.pkl",
              "api_cache/spp_load_model.pkl",
          ]
          for filename in models:
              print(f"Downloading {filename} ...", flush=True)
              hf_hub_download(
                  repo_id=repo, repo_type="space",
                  filename=filename, local_dir=".",
                  token=token,
              )
              print(f"  done", flush=True)
          EOF

      - name: Generate forecast caches
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python precache_forecasts.py

      - name: Upload fresh caches to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import upload_file

          repo = "JollyAkshay/grid-dashboard"
          token = os.environ["HF_TOKEN"]
          caches = [
              "api_cache/pjm_forecast_cache.json",
              "api_cache/caiso_forecast_cache.json",
              "api_cache/ercot_forecast_cache.json",
              "api_cache/miso_forecast_cache.json",
              "api_cache/nyiso_forecast_cache.json",
              "api_cache/isone_forecast_cache.json",
              "api_cache/spp_forecast_cache.json",
          ]
          for path in caches:
              print(f"Uploading {path} ...", flush=True)
              upload_file(
                  path_or_fileobj=path, path_in_repo=path,
                  repo_id=repo, repo_type="space",
                  token=token,
              )
              print(f"  done", flush=True)
          EOF

      - name: Download existing forward-curve archive + price history
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import hf_hub_download
          from huggingface_hub.utils import EntryNotFoundError

          repo = "JollyAkshay/grid-dashboard"
          token = os.environ["HF_TOKEN"]
          isos = ["pjm", "caiso", "ercot", "miso", "nyiso", "isone", "spp"]

          # Existing archive (if any) so today's snapshot appends instead of
          # starting the history over from a fresh checkout every run. Also
          # grab any legacy fixed-window cache (730d/400d, naming varies by
          # when it was last written) so _load_price_history's one-time
          # migration has something to seed the new archive from on a
          # runner that has never built one before — otherwise every ISO
          # would re-bootstrap from scratch on this workflow's first run
          # after the archive-format switch.
          filenames = [f"api_cache/{iso}_forward_curve_history.jsonl" for iso in isos]
          filenames += [f"api_cache/{iso}_price_history_archive.json" for iso in isos]
          filenames += [f"api_cache/{iso}_price_history_{d}d.json" for iso in isos for d in (730, 400)]
          filenames.append("api_cache/hh_futures_cache.json")

          for filename in filenames:
              try:
                  hf_hub_download(repo_id=repo, repo_type="space",
                                   filename=filename, local_dir=".", token=token)
                  print(f"Downloaded {filename}", flush=True)
              except EntryNotFoundError:
                  print(f"{filename} doesn't exist yet on the Space — starting fresh", flush=True)
          EOF

      - name: Build forward curves (this appends today's snapshot to the archive)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          from temperature_modeling.forward_curve import build_forward_curve

          for iso in ["pjm", "caiso", "ercot", "miso", "nyiso", "isone", "spp"]:
              try:
                  result = build_forward_curve(iso, n_months=12)
                  print(f"{iso}: {result['model_source']}", flush=True)
              except Exception as exc:
                  print(f"{iso}: FAILED — {exc}", flush=True)
          EOF

      - name: Upload forward-curve archive + price history to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import glob
          import os
          from huggingface_hub import upload_file

          repo = "JollyAkshay/grid-dashboard"
          token = os.environ["HF_TOKEN"]

          patterns = [
              "api_cache/*_forward_curve_history.jsonl",
              "api_cache/*_price_history_archive.json",
              "api_cache/hh_futures_cache.json",
          ]
          for pattern in patterns:
              for path in glob.glob(pattern):
                  print(f"Uploading {path} ...", flush=True)
                  upload_file(
                      path_or_fileobj=path, path_in_repo=path,
                      repo_id=repo, repo_type="space",
                      token=token,
                  )
                  print(f"  done", flush=True)
          EOF
