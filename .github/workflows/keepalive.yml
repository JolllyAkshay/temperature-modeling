name: Keep Space Awake

on:
  schedule:
    # Every 30 min — well under the 48h free-tier idle-sleep window
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://jollyakshay-grid-dashboard.hf.space/)
          echo "Dashboard responded with HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "::warning::Dashboard returned $status — may be crashed, not just asleep"
          fi
